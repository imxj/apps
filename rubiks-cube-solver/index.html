<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Rubik's Cube Solver</title>
<style>
  :root {
    --bg: #0e1116;
    --panel: #171b22;
    --panel2: #1f2530;
    --line: #2a3140;
    --text: #e6e9ef;
    --muted: #9aa4b2;
    --accent: #4f9dff;
    --accent2: #2dd4a7;
    --danger: #ff6b6b;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: radial-gradient(1200px 700px at 20% -10%, #1a2030, var(--bg));
    color: var(--text);
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: flex; flex-direction: column; height: 100vh; overflow: hidden;
  }
  header {
    padding: 14px 22px; border-bottom: 1px solid var(--line);
    display: flex; align-items: baseline; gap: 14px; flex: 0 0 auto;
  }
  header h1 { font-size: 19px; margin: 0; letter-spacing: .3px; }
  header .sub { color: var(--muted); font-size: 13px; }
  main { flex: 1 1 auto; display: grid; grid-template-columns: 1fr 420px; min-height: 0; }
  #viewport { position: relative; min-width: 0; }
  #viewport canvas { display: block; width: 100%; height: 100%; }
  #hint {
    position: absolute; left: 50%; bottom: 16px; transform: translateX(-50%);
    color: var(--muted); font-size: 12px; background: rgba(0,0,0,.35);
    padding: 6px 12px; border-radius: 20px; pointer-events: none; white-space: nowrap;
  }
  #panel {
    border-left: 1px solid var(--line); background: var(--panel);
    padding: 18px; overflow-y: auto; display: flex; flex-direction: column; gap: 16px;
  }
  .card { background: var(--panel2); border: 1px solid var(--line); border-radius: 12px; padding: 14px; }
  .card h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .8px; color: var(--muted); margin: 0 0 10px; }

  /* palette */
  .palette { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .swatch {
    width: 34px; height: 34px; border-radius: 8px; cursor: pointer;
    border: 3px solid transparent; box-shadow: inset 0 0 0 1px rgba(0,0,0,.35);
    transition: transform .08s;
  }
  .swatch:hover { transform: scale(1.06); }
  .swatch.sel { border-color: #fff; box-shadow: 0 0 0 2px var(--accent); }

  /* net */
  .net { display: grid; grid-template-columns: repeat(12, 1fr); grid-template-rows: repeat(9, 1fr);
         gap: 3px; width: 100%; aspect-ratio: 12 / 9; }
  .cell { border-radius: 4px; box-shadow: inset 0 0 0 1px rgba(0,0,0,.35); }
  .cell.pad { background: transparent; box-shadow: none; }
  .cell.sticker { cursor: pointer; transition: transform .05s; }
  .cell.sticker:hover { transform: scale(1.08); outline: 1px solid rgba(255,255,255,.5); }
  .cell.center { cursor: not-allowed; }
  .cell.center::after { content: "•"; display: grid; place-items: center; height: 100%; color: rgba(0,0,0,.45); font-size: 14px; }
  body.play .cell.sticker { cursor: default; }
  body.play .cell.sticker:hover { transform: none; outline: none; }

  /* buttons */
  .row { display: flex; gap: 8px; flex-wrap: wrap; }
  button {
    font: inherit; color: var(--text); background: #2b3342; border: 1px solid var(--line);
    padding: 9px 13px; border-radius: 9px; cursor: pointer; transition: background .12s, opacity .12s;
    display: inline-flex; align-items: center; gap: 6px;
  }
  button:hover { background: #364154; }
  button:disabled { opacity: .4; cursor: not-allowed; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #07121f; font-weight: 600; }
  button.primary:hover { background: #6aacff; }
  button.good { background: var(--accent2); border-color: var(--accent2); color: #062018; font-weight: 600; }
  button.ghost { background: transparent; }
  button.icon { padding: 9px 12px; font-size: 16px; }

  .status { font-size: 13px; color: var(--muted); min-height: 18px; }
  .status.err { color: var(--danger); }

  /* instruction */
  #instr { font-size: 16px; line-height: 1.4; }
  #instr b { color: var(--accent); }
  #moveBadge {
    display: inline-grid; place-items: center; min-width: 46px; height: 46px; padding: 0 10px;
    border-radius: 10px; background: #0e1320; border: 1px solid var(--accent);
    font-size: 22px; font-weight: 700; font-family: ui-monospace, Menlo, monospace; margin-right: 10px;
    vertical-align: middle; color: var(--accent);
  }
  #progress { font-size: 12px; color: var(--muted); margin-top: 8px; }

  /* steps */
  .steps { display: flex; flex-wrap: wrap; gap: 6px; max-height: 160px; overflow-y: auto; }
  .step {
    font-family: ui-monospace, Menlo, monospace; font-size: 13px; padding: 5px 9px; border-radius: 7px;
    background: #232b38; border: 1px solid var(--line); cursor: pointer; min-width: 34px; text-align: center;
  }
  .step:hover { background: #2c3646; }
  .step.done { color: var(--muted); opacity: .65; }
  .step.cur { background: var(--accent); color: #07121f; border-color: var(--accent); font-weight: 700; }

  .hide { display: none !important; }
  .speedrow { display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--muted); }
  input[type=range] { flex: 1; accent-color: var(--accent); }

  /* overlay */
  #overlay {
    position: fixed; inset: 0; background: rgba(8,10,14,.78); display: none;
    place-items: center; z-index: 50; backdrop-filter: blur(2px);
  }
  #overlay.show { display: grid; }
  .spinner { width: 42px; height: 42px; border: 4px solid #2a3140; border-top-color: var(--accent);
             border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto 14px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .ov-box { text-align: center; background: var(--panel); padding: 26px 34px; border-radius: 14px; border: 1px solid var(--line); }
</style>
</head>
<body class="edit">
<header>
  <h1>🧩 Rubik's Cube Solver</h1>
  <span class="sub">Paint your scrambled cube, then watch it solve — step by step.</span>
</header>

<main>
  <div id="viewport">
    <div id="hint">Drag to rotate · scroll to zoom</div>
  </div>

  <aside id="panel">
    <!-- EDIT MODE -->
    <div id="editControls">
      <div class="card">
        <h2>1 · Pick a color, then click stickers</h2>
        <div class="palette" id="palette"></div>
      </div>

      <div class="card" style="margin-top:16px">
        <h2>2 · Your cube (unfolded)</h2>
        <div class="net" id="net"></div>
        <div class="status" id="editStatus" style="margin-top:10px"></div>
      </div>

      <div class="card" style="margin-top:16px">
        <h2>3 · Set it up</h2>
        <div class="row">
          <button id="btnScramble">🎲 Scramble</button>
          <button id="btnReset" class="ghost">↺ Reset to solved</button>
          <button id="btnSolve" class="good" style="margin-left:auto">✨ Solve</button>
        </div>
      </div>
    </div>

    <!-- PLAY MODE -->
    <div id="playControls" class="hide">
      <div class="card">
        <h2>Instruction</h2>
        <div id="instr"></div>
        <div id="progress"></div>
      </div>

      <div class="card" style="margin-top:16px">
        <h2>Controls</h2>
        <div class="row" style="justify-content:center">
          <button id="btnRestart" class="icon" title="Back to start">⏮</button>
          <button id="btnPrev" class="icon" title="Previous">◀</button>
          <button id="btnPlay" class="primary" style="min-width:96px">▶ Play</button>
          <button id="btnNext" class="icon" title="Next">▶</button>
        </div>
        <div class="speedrow" style="margin-top:14px">
          <span>Speed</span>
          <input type="range" id="speed" min="120" max="900" value="420" step="20" />
        </div>
      </div>

      <div class="card" style="margin-top:16px">
        <h2>Solution (<span id="moveCount">0</span> moves)</h2>
        <div class="steps" id="steps"></div>
      </div>

      <div class="row" style="margin-top:4px">
        <button id="btnEdit" class="ghost">✎ Edit cube</button>
      </div>
    </div>
  </aside>
</main>

<div id="overlay"><div class="ov-box"><div class="spinner"></div><div id="ovText">Preparing solver…</div></div></div>

<script src="https://cdn.jsdelivr.net/npm/three@0.137.5/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.137.5/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/cubejs@1.3.2/lib/cube.js"></script>
<script src="https://cdn.jsdelivr.net/npm/cubejs@1.3.2/lib/solve.js"></script>
<script>
/* =====================================================================
   CORE CUBE ENGINE  (verified against cubejs: matches its move engine on
   2000 random scrambles, end-to-end solves correctly)
   ===================================================================== */
function rot(v, axis, dir) {
  const [x, y, z] = v;
  if (axis === 'x') return dir > 0 ? [x, -z, y] : [x, z, -y];
  if (axis === 'y') return dir > 0 ? [z, y, -x] : [-z, y, x];
  return dir > 0 ? [-y, x, z] : [y, -x, z];
}
const MOVES = {
  U: { axis: 'y', layer: 1, dir: -1 },
  D: { axis: 'y', layer: -1, dir: 1 },
  R: { axis: 'x', layer: 1, dir: -1 },
  L: { axis: 'x', layer: -1, dir: 1 },
  F: { axis: 'z', layer: 1, dir: -1 },
  B: { axis: 'z', layer: -1, dir: 1 },
};
function buildSlots() {
  const slots = [];
  const add = (face, r, c, pos, n) => slots.push({ face, idx: r * 3 + c, pos, n });
  for (let r = 0; r < 3; r++) for (let c = 0; c < 3; c++) add('U', r, c, [c - 1, 1, r - 1], [0, 1, 0]);
  for (let r = 0; r < 3; r++) for (let c = 0; c < 3; c++) add('R', r, c, [1, 1 - r, 1 - c], [1, 0, 0]);
  for (let r = 0; r < 3; r++) for (let c = 0; c < 3; c++) add('F', r, c, [c - 1, 1 - r, 1], [0, 0, 1]);
  for (let r = 0; r < 3; r++) for (let c = 0; c < 3; c++) add('D', r, c, [c - 1, -1, 1 - r], [0, -1, 0]);
  for (let r = 0; r < 3; r++) for (let c = 0; c < 3; c++) add('L', r, c, [-1, 1 - r, c - 1], [-1, 0, 0]);
  for (let r = 0; r < 3; r++) for (let c = 0; c < 3; c++) add('B', r, c, [1 - c, 1 - r, -1], [0, 0, -1]);
  return slots;
}
const SLOTS = buildSlots();
const FACE_ORDER = { U: 0, R: 1, F: 2, D: 3, L: 4, B: 5 };

function buildSolved() {
  const cubies = [];
  for (let x = -1; x <= 1; x++) for (let y = -1; y <= 1; y++) for (let z = -1; z <= 1; z++) {
    if (x === 0 && y === 0 && z === 0) continue;
    const stickers = [];
    if (x === 1) stickers.push({ n: [1, 0, 0], color: 'R' });
    if (x === -1) stickers.push({ n: [-1, 0, 0], color: 'L' });
    if (y === 1) stickers.push({ n: [0, 1, 0], color: 'U' });
    if (y === -1) stickers.push({ n: [0, -1, 0], color: 'D' });
    if (z === 1) stickers.push({ n: [0, 0, 1], color: 'F' });
    if (z === -1) stickers.push({ n: [0, 0, -1], color: 'B' });
    cubies.push({ pos: [x, y, z], stickers });
  }
  return cubies;
}
function expandMove(token) {
  const m = MOVES[token[0]];
  if (!m) return null;
  const suffix = token.slice(1);
  let dir = m.dir, count = 1;
  if (suffix === "'") dir = -m.dir;
  else if (suffix === '2') count = 2;
  const ops = [];
  for (let i = 0; i < count; i++) ops.push({ axis: m.axis, layer: m.layer, dir });
  return { face: token[0], axis: m.axis, layer: m.layer, ops, angle: count * dir * (Math.PI / 2) };
}
function applyQuarter(cubies, axis, layer, dir) {
  const ai = axis === 'x' ? 0 : axis === 'y' ? 1 : 2;
  for (const cu of cubies) {
    if (cu.pos[ai] !== layer) continue;
    cu.pos = rot(cu.pos, axis, dir);
    for (const s of cu.stickers) s.n = rot(s.n, axis, dir);
  }
}
function applyMove(cubies, token) {
  const mv = expandMove(token);
  if (mv) for (const op of mv.ops) applyQuarter(cubies, op.axis, op.layer, op.dir);
}
const posKey = (p) => p[0] + ',' + p[1] + ',' + p[2];
function getFacelets(cubies) {
  const byPos = new Map();
  for (const cu of cubies) byPos.set(posKey(cu.pos), cu);
  const out = new Array(54);
  for (let i = 0; i < SLOTS.length; i++) {
    const slot = SLOTS[i];
    const cu = byPos.get(posKey(slot.pos));
    const s = cu.stickers.find(s => s.n[0] === slot.n[0] && s.n[1] === slot.n[1] && s.n[2] === slot.n[2]);
    out[i] = s.color;
  }
  return out.join('');
}
// Build a (solved-geometry) model whose sticker colors equal a facelet string.
function buildFromFacelets(facelets) {
  const cubies = buildSolved();
  const byPos = new Map();
  for (const cu of cubies) byPos.set(posKey(cu.pos), cu);
  for (let i = 0; i < SLOTS.length; i++) {
    const slot = SLOTS[i];
    const cu = byPos.get(posKey(slot.pos));
    const s = cu.stickers.find(s => s.n[0] === slot.n[0] && s.n[1] === slot.n[1] && s.n[2] === slot.n[2]);
    s.color = facelets[i];
  }
  return cubies;
}

/* =====================================================================
   COLORS / LABELS
   ===================================================================== */
const COLORS = { U: 0xffffff, R: 0xc41e3a, F: 0x00923f, D: 0xffd500, L: 0xff5800, B: 0x0051ba };
const COLOR_CSS = { U: '#ffffff', R: '#c41e3a', F: '#00923f', D: '#ffd500', L: '#ff5800', B: '#0051ba' };
const COLOR_NAME = { U: 'White', R: 'Red', F: 'Green', D: 'Yellow', L: 'Orange', B: 'Blue' };
const FACE_NAME = { U: 'Up', R: 'Right', F: 'Front', D: 'Down', L: 'Left', B: 'Back' };
const SOLVED_STR = getFacelets(buildSolved());

/* =====================================================================
   STATE
   ===================================================================== */
let model = buildSolved();      // edit-mode model is always solved-geometry; only colors change
let selColor = 'U';
let solverReady = false;

// play-mode state
let solution = [];              // array of tokens
let stepIndex = 0;              // how many solution moves applied
let startFacelets = SOLVED_STR; // snapshot at solve time
let playing = false;
let animating = false;

/* =====================================================================
   THREE.JS SCENE
   ===================================================================== */
const viewport = document.getElementById('viewport');
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 100);
camera.position.set(4.2, 4.0, 5.4);
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(window.devicePixelRatio);
viewport.appendChild(renderer.domElement);
const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.12;
controls.minDistance = 4; controls.maxDistance = 14;

const SPACING = 1.0, BODY = 0.94, STICKER = 0.84;
const DIRS = [
  { key: 'px', n: [1, 0, 0] }, { key: 'nx', n: [-1, 0, 0] },
  { key: 'py', n: [0, 1, 0] }, { key: 'ny', n: [0, -1, 0] },
  { key: 'pz', n: [0, 0, 1] }, { key: 'nz', n: [0, 0, -1] },
];
function orientPlane(mesh, n) {
  if (n[0] === 1) { mesh.rotation.y = Math.PI / 2; mesh.position.set(0.5, 0, 0); }
  else if (n[0] === -1) { mesh.rotation.y = -Math.PI / 2; mesh.position.set(-0.5, 0, 0); }
  else if (n[1] === 1) { mesh.rotation.x = -Math.PI / 2; mesh.position.set(0, 0.5, 0); }
  else if (n[1] === -1) { mesh.rotation.x = Math.PI / 2; mesh.position.set(0, -0.5, 0); }
  else if (n[2] === 1) { mesh.position.set(0, 0, 0.5); }
  else { mesh.rotation.y = Math.PI; mesh.position.set(0, 0, -0.5); }
}

// persistent group meshes, one per cubie (order matches buildSolved order)
const groups = [];
const cubeRoot = new THREE.Group();
scene.add(cubeRoot);
const bodyGeo = new THREE.BoxGeometry(BODY, BODY, BODY);
const bodyMat = new THREE.MeshBasicMaterial({ color: 0x0b0d12 });
const stickerGeo = new THREE.PlaneGeometry(STICKER, STICKER);
{
  // build 26 groups (same iteration order as buildSolved)
  for (let x = -1; x <= 1; x++) for (let y = -1; y <= 1; y++) for (let z = -1; z <= 1; z++) {
    if (x === 0 && y === 0 && z === 0) continue;
    const g = new THREE.Group();
    g.add(new THREE.Mesh(bodyGeo, bodyMat));
    g.planes = {};
    for (const d of DIRS) {
      const mat = new THREE.MeshBasicMaterial({ color: 0x111111, side: THREE.DoubleSide });
      const pm = new THREE.Mesh(stickerGeo, mat);
      orientPlane(pm, d.n);
      pm.visible = false;
      g.add(pm);
      g.planes[d.key] = pm;
    }
    cubeRoot.add(g);
    groups.push(g);
  }
}
function dirKey(n) {
  if (n[0] === 1) return 'px'; if (n[0] === -1) return 'nx';
  if (n[1] === 1) return 'py'; if (n[1] === -1) return 'ny';
  if (n[2] === 1) return 'pz'; return 'nz';
}
// Re-link group<->cubie by index and render colors/positions from the logical model.
function resyncCube() {
  for (let i = 0; i < groups.length; i++) {
    const g = groups[i], cu = model[i];
    g.position.set(cu.pos[0] * SPACING, cu.pos[1] * SPACING, cu.pos[2] * SPACING);
    g.quaternion.identity();
    for (const d of DIRS) g.planes[d.key].visible = false;
    for (const s of cu.stickers) {
      const pl = g.planes[dirKey(s.n)];
      pl.visible = true;
      pl.material.color.setHex(COLORS[s.color]);
    }
  }
}

function resize() {
  const w = viewport.clientWidth, h = viewport.clientHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h; camera.updateProjectionMatrix();
}
window.addEventListener('resize', resize);

function loop() {
  requestAnimationFrame(loop);
  controls.update();
  renderer.render(scene, camera);
}

/* =====================================================================
   ANIMATION OF A MOVE
   ===================================================================== */
const AXIS_VEC = { x: new THREE.Vector3(1, 0, 0), y: new THREE.Vector3(0, 1, 0), z: new THREE.Vector3(0, 0, 1) };
function animateMove(token, duration) {
  return new Promise(resolve => {
    const mv = expandMove(token);
    if (!mv) return resolve();
    const ai = mv.axis === 'x' ? 0 : mv.axis === 'y' ? 1 : 2;
    const pivot = new THREE.Group();
    cubeRoot.add(pivot);
    const slice = [];
    for (let i = 0; i < groups.length; i++) {
      if (model[i].pos[ai] === mv.layer) { slice.push(groups[i]); pivot.attach(groups[i]); }
    }
    const axisVec = AXIS_VEC[mv.axis];
    const t0 = performance.now();
    function frame(now) {
      const t = Math.min(1, (now - t0) / duration);
      const e = t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2; // easeInOutQuad
      pivot.quaternion.setFromAxisAngle(axisVec, mv.angle * e);
      if (t < 1) { requestAnimationFrame(frame); return; }
      for (const g of slice) cubeRoot.attach(g);
      cubeRoot.remove(pivot);
      applyMove(model, token);  // update logical state
      resyncCube();             // snap visuals to logical (identical to final frame)
      resolve();
    }
    requestAnimationFrame(frame);
  });
}

/* =====================================================================
   2D NET (editor)
   ===================================================================== */
const netEl = document.getElementById('net');
const NET_FACE_POS = { // [rowStart, colStart] within 9x12 grid (1-based grid lines)
  U: [1, 4], L: [4, 1], F: [4, 4], R: [4, 7], B: [4, 10], D: [7, 4],
};
const cellEls = {}; // "F4" -> element
function buildNet() {
  netEl.innerHTML = '';
  const grid = {}; // "r,c" occupied
  for (const face of Object.keys(NET_FACE_POS)) {
    const [r0, c0] = NET_FACE_POS[face];
    for (let r = 0; r < 3; r++) for (let c = 0; c < 3; c++) {
      const idx = r * 3 + c;
      const cell = document.createElement('div');
      cell.className = 'cell sticker';
      cell.style.gridRow = (r0 + r); cell.style.gridColumn = (c0 + c);
      if (idx === 4) cell.classList.add('center');
      cell.dataset.face = face; cell.dataset.idx = idx;
      cell.addEventListener('click', () => onPaint(face, idx));
      netEl.appendChild(cell);
      cellEls[face + idx] = cell;
      grid[(r0 + r) + ',' + (c0 + c)] = true;
    }
  }
  // pad empties so grid keeps shape
  for (let r = 1; r <= 9; r++) for (let c = 1; c <= 12; c++) {
    if (!grid[r + ',' + c]) {
      const pad = document.createElement('div');
      pad.className = 'cell pad'; pad.style.gridRow = r; pad.style.gridColumn = c;
      netEl.appendChild(pad);
    }
  }
}
function renderNet() {
  const f = getFacelets(model);
  for (const face of Object.keys(NET_FACE_POS)) {
    for (let idx = 0; idx < 9; idx++) {
      const letter = f[FACE_ORDER[face] * 9 + idx];
      cellEls[face + idx].style.background = COLOR_CSS[letter];
    }
  }
}
function onPaint(face, idx) {
  if (document.body.classList.contains('play')) return;
  if (idx === 4) return; // centers locked
  // set the sticker color on the cubie occupying this slot (solved geometry in edit mode)
  const slot = SLOTS[FACE_ORDER[face] * 9 + idx];
  const cu = model.find(c => posKey(c.pos) === posKey(slot.pos));
  const s = cu.stickers.find(s => s.n[0] === slot.n[0] && s.n[1] === slot.n[1] && s.n[2] === slot.n[2]);
  s.color = selColor;
  renderNet(); resyncCube();
  validateEdit();
}

/* palette */
const paletteEl = document.getElementById('palette');
function buildPalette() {
  for (const letter of ['U', 'R', 'F', 'D', 'L', 'B']) {
    const sw = document.createElement('div');
    sw.className = 'swatch' + (letter === selColor ? ' sel' : '');
    sw.style.background = COLOR_CSS[letter];
    sw.title = COLOR_NAME[letter];
    sw.addEventListener('click', () => {
      selColor = letter;
      [...paletteEl.children].forEach(c => c.classList.remove('sel'));
      sw.classList.add('sel');
    });
    paletteEl.appendChild(sw);
  }
}

/* =====================================================================
   EDIT VALIDATION
   ===================================================================== */
const editStatus = document.getElementById('editStatus');
function colorCounts() {
  const f = getFacelets(model), c = {};
  for (const ch of f) c[ch] = (c[ch] || 0) + 1;
  return c;
}
function validateEdit() {
  const c = colorCounts();
  const bad = [];
  for (const l of ['U', 'R', 'F', 'D', 'L', 'B']) if ((c[l] || 0) !== 9) bad.push(`${COLOR_NAME[l]}: ${c[l] || 0}`);
  if (bad.length) {
    editStatus.className = 'status err';
    editStatus.textContent = 'Each color needs exactly 9 stickers — ' + bad.join(', ');
    return false;
  }
  editStatus.className = 'status';
  editStatus.textContent = 'Color counts look good. Ready to solve.';
  return true;
}

/* =====================================================================
   SOLVE + PLAYBACK
   ===================================================================== */
const overlay = document.getElementById('overlay');
const ovText = document.getElementById('ovText');
function showOverlay(t) { ovText.textContent = t; overlay.classList.add('show'); }
function hideOverlay() { overlay.classList.remove('show'); }

function ensureSolver() {
  return new Promise(resolve => {
    if (solverReady) return resolve();
    showOverlay('Preparing solver tables… (one-time, a few seconds)');
    setTimeout(() => {
      Cube.initSolver();
      solverReady = true;
      hideOverlay();
      resolve();
    }, 60);
  });
}

async function doSolve() {
  if (!validateEdit()) return;
  const facelets = getFacelets(model);
  if (facelets === SOLVED_STR) {
    editStatus.className = 'status';
    editStatus.textContent = 'This cube is already solved! 🎉';
    return;
  }
  await ensureSolver();
  let sol;
  try {
    sol = Cube.fromString(facelets).solve();
  } catch (e) {
    editStatus.className = 'status err';
    editStatus.textContent = "That sticker layout isn't a solvable cube. Double-check your colors.";
    return;
  }
  if (!sol || /[^URFDLB2' ]/.test(sol)) {
    editStatus.className = 'status err';
    editStatus.textContent = "That sticker layout isn't a solvable cube. Double-check your colors.";
    return;
  }
  solution = sol.trim().split(/\s+/).filter(Boolean);
  startFacelets = facelets;
  enterPlayMode();
}

function enterPlayMode() {
  document.body.classList.remove('edit');
  document.body.classList.add('play');
  document.getElementById('editControls').classList.add('hide');
  document.getElementById('playControls').classList.remove('hide');
  document.getElementById('hint').textContent = 'Drag to rotate · scroll to zoom';
  document.getElementById('moveCount').textContent = solution.length;
  buildSteps();
  restart();
}
function enterEditMode() {
  pausePlay();
  document.body.classList.remove('play');
  document.body.classList.add('edit');
  document.getElementById('playControls').classList.add('hide');
  document.getElementById('editControls').classList.remove('hide');
  // restore the cube the user had set up
  model = buildFromFacelets(startFacelets);
  resyncCube(); renderNet(); validateEdit();
}

const stepsEl = document.getElementById('steps');
function buildSteps() {
  stepsEl.innerHTML = '';
  solution.forEach((tok, i) => {
    const el = document.createElement('div');
    el.className = 'step'; el.textContent = tok;
    el.addEventListener('click', () => jumpTo(i));
    stepsEl.appendChild(el);
  });
}
function renderSteps() {
  [...stepsEl.children].forEach((el, i) => {
    el.classList.toggle('done', i < stepIndex);
    el.classList.toggle('cur', i === stepIndex);
  });
  const curEl = stepsEl.children[stepIndex];
  if (curEl) curEl.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
}

const instrEl = document.getElementById('instr');
const progressEl = document.getElementById('progress');
function dirWord(tok) {
  if (tok.endsWith("'")) return 'a quarter turn <b>counter-clockwise</b>';
  if (tok.endsWith('2')) return 'a <b>half turn (180°)</b>';
  return 'a quarter turn <b>clockwise</b>';
}
function renderInstr() {
  if (stepIndex >= solution.length) {
    instrEl.innerHTML = '🎉 <b>Solved!</b> Every face is now a single color.';
    progressEl.textContent = `${solution.length} of ${solution.length} moves done.`;
    return;
  }
  const tok = solution[stepIndex];
  const face = tok[0];
  instrEl.innerHTML =
    `<span id="moveBadge">${tok}</span> Turn the <b>${FACE_NAME[face]}</b> face (${COLOR_NAME[face]} center) ` +
    `${dirWord(tok)}, looking at that face head-on.`;
  progressEl.textContent = `Step ${stepIndex + 1} of ${solution.length}`;
}

// rebuild model to start, then instantly apply first k moves
function setToStep(k) {
  model = buildFromFacelets(startFacelets);
  for (let i = 0; i < k; i++) applyMove(model, solution[i]);
  stepIndex = k;
  resyncCube(); renderNet(); renderSteps(); renderInstr();
}
function restart() { pausePlay(); setToStep(0); }
function jumpTo(i) { pausePlay(); setToStep(Math.max(0, Math.min(solution.length, i))); }

const speedEl = document.getElementById('speed');
function moveDuration() { return Number(speedEl.value); }

async function stepNext() {
  if (animating || stepIndex >= solution.length) return false;
  animating = true;
  const tok = solution[stepIndex];
  await animateMove(tok, moveDuration());
  stepIndex++;
  renderNet(); renderSteps(); renderInstr();
  animating = false;
  return true;
}
function stepPrev() {
  if (animating || stepIndex <= 0) return;
  setToStep(stepIndex - 1);
}

const btnPlay = document.getElementById('btnPlay');
function setPlayBtn() { btnPlay.innerHTML = playing ? '⏸ Pause' : '▶ Play'; }
async function play() {
  if (playing) return;
  if (stepIndex >= solution.length) setToStep(0);
  playing = true; setPlayBtn();
  while (playing && stepIndex < solution.length) {
    const ok = await stepNext();
    if (!ok) break;
    await new Promise(r => setTimeout(r, 90));
  }
  playing = false; setPlayBtn();
}
function pausePlay() { playing = false; setPlayBtn(); }

/* =====================================================================
   SCRAMBLE / RESET
   ===================================================================== */
function scramble() {
  const faces = ['U', 'D', 'L', 'R', 'F', 'B'], suf = ['', "'", '2'];
  const tmp = buildSolved();
  let last = '';
  for (let i = 0; i < 25; i++) {
    let f; do { f = faces[Math.floor(Math.random() * 6)]; } while (f === last);
    last = f;
    applyMove(tmp, f + suf[Math.floor(Math.random() * 3)]);
  }
  model = buildFromFacelets(getFacelets(tmp)); // collapse to solved-geometry coloring
  resyncCube(); renderNet(); validateEdit();
}
function resetSolved() {
  model = buildSolved();
  resyncCube(); renderNet(); validateEdit();
}

/* =====================================================================
   WIRE UP
   ===================================================================== */
document.getElementById('btnScramble').addEventListener('click', scramble);
document.getElementById('btnReset').addEventListener('click', resetSolved);
document.getElementById('btnSolve').addEventListener('click', doSolve);
document.getElementById('btnPlay').addEventListener('click', () => playing ? pausePlay() : play());
document.getElementById('btnNext').addEventListener('click', stepNext);
document.getElementById('btnPrev').addEventListener('click', stepPrev);
document.getElementById('btnRestart').addEventListener('click', restart);
document.getElementById('btnEdit').addEventListener('click', enterEditMode);

/* INIT */
buildPalette();
buildNet();
resize();
resyncCube();
renderNet();
validateEdit();
loop();
</script>
</body>
</html>
