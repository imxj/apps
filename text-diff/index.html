<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text Diff Tool - Compare Text Online</title>
    <meta name="description" content="Compare two texts side by side and highlight differences. Free online diff tool for code, documents, and any text.">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #1a1a2e;
            color: #eee;
            min-height: 100vh;
            padding: 20px;
        }
        h1 { text-align: center; margin-bottom: 20px; color: #4facfe; }
        .container { max-width: 1400px; margin: 0 auto; }
        .inputs {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }
        .input-group { display: flex; flex-direction: column; }
        .input-group label {
            margin-bottom: 8px;
            font-weight: 500;
            color: #aaa;
        }
        textarea {
            height: 200px;
            padding: 15px;
            border: 2px solid #333;
            border-radius: 8px;
            background: #16213e;
            color: #eee;
            font-family: 'Monaco', 'Menlo', monospace;
            font-size: 14px;
            resize: vertical;
        }
        textarea:focus { outline: none; border-color: #4facfe; }
        .buttons { text-align: center; margin-bottom: 20px; }
        button {
            padding: 12px 30px;
            font-size: 1rem;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            margin: 0 10px;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        button:hover { transform: scale(1.05); }
        .btn-compare {
            background: linear-gradient(135deg, #4facfe, #00f2fe);
            color: #1a1a2e;
            font-weight: 600;
        }
        .btn-clear {
            background: #333;
            color: #eee;
        }
        .btn-swap {
            background: #764ba2;
            color: white;
        }
        .diff-table-wrapper {
            background: #16213e;
            border-radius: 8px;
            overflow-x: auto;
        }
        .diff-table {
            width: 100%;
            border-collapse: collapse;
            font-family: 'Monaco', 'Menlo', monospace;
            font-size: 14px;
            table-layout: fixed;
        }
        .diff-table thead th {
            padding: 10px 15px;
            color: #888;
            font-size: 0.9rem;
            font-weight: 500;
            text-align: left;
            border-bottom: 1px solid #333;
            width: 50%;
        }
        .diff-table td {
            padding: 1px 8px;
            vertical-align: top;
            white-space: pre-wrap;
            word-break: break-all;
            line-height: 1.6;
            min-height: 1.6em;
            border-right: 1px solid #333;
        }
        .diff-table td:last-child {
            border-right: none;
        }
        .diff-table tr.unchanged td { color: #888; }
        .diff-table tr.pad td { background: rgba(128,128,128,0.1); }
        .diff-table tr.removed-row td.left-cell { background: rgba(255, 0, 0, 0.1); }
        .diff-table tr.removed-row td.right-cell { background: rgba(128,128,128,0.05); }
        .diff-table tr.added-row td.right-cell { background: rgba(0, 255, 0, 0.1); }
        .diff-table tr.added-row td.left-cell { background: rgba(128,128,128,0.05); }
        .diff-table tr.modified-row td.left-cell { background: rgba(255, 165, 0, 0.08); }
        .diff-table tr.modified-row td.right-cell { background: rgba(255, 165, 0, 0.08); }
        .added { background: rgba(0, 255, 0, 0.2); color: #4ade80; }
        .removed { background: rgba(255, 0, 0, 0.2); color: #f87171; text-decoration: line-through; }
        .stats {
            text-align: center;
            margin: 20px 0;
            color: #888;
        }
        .stats span { margin: 0 15px; }
        .stats .add-count { color: #4ade80; }
        .stats .remove-count { color: #f87171; }
        @media (max-width: 768px) {
            .inputs { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📝 Text Diff Tool</h1>
        <div class="inputs">
            <div class="input-group">
                <label>Original Text</label>
                <textarea id="text1" placeholder="Paste original text here..."></textarea>
            </div>
            <div class="input-group">
                <label>Modified Text</label>
                <textarea id="text2" placeholder="Paste modified text here..."></textarea>
            </div>
        </div>
        <div class="buttons">
            <button class="btn-compare" onclick="compare()">Compare</button>
            <button class="btn-swap" onclick="swap()">⇄ Swap</button>
            <button class="btn-clear" onclick="clearAll()">Clear</button>
        </div>
        <div class="stats" id="stats"></div>
        <div class="diff-table-wrapper">
            <table class="diff-table" id="diffTable">
                <thead>
                    <tr>
                        <th>Original (with removals)</th>
                        <th>Modified (with additions)</th>
                    </tr>
                </thead>
                <tbody id="diffBody"></tbody>
            </table>
        </div>
    </div>

    <script>
        function compare() {
            const text1 = document.getElementById('text1').value;
            const text2 = document.getElementById('text2').value;
            
            const lines1 = text1.split('\n');
            const lines2 = text2.split('\n');
            
            // Line-level LCS for alignment
            const lineLcs = longestCommonSubsequence(lines1, lines2);
            
            let rows = [];
            let i = 0, j = 0, k = 0;
            let added = 0, removed = 0;
            
            while (i < lines1.length || j < lines2.length) {
                if (k < lineLcs.length && i < lines1.length && lines1[i] === lineLcs[k]) {
                    if (j < lines2.length && lines2[j] === lineLcs[k]) {
                        // Matching line
                        rows.push({ type: 'unchanged', left: escapeHtml(lines1[i]), right: escapeHtml(lines2[j]) });
                        i++; j++; k++;
                    } else {
                        // Added line on right
                        rows.push({ type: 'added', left: '', right: escapeHtml(lines2[j]) });
                        added++;
                        j++;
                    }
                } else if (k < lineLcs.length && j < lines2.length && lines2[j] === lineLcs[k]) {
                    // Removed line on left
                    rows.push({ type: 'removed', left: escapeHtml(lines1[i]), right: '' });
                    removed++;
                    i++;
                } else if (i < lines1.length && j < lines2.length) {
                    // Modified line — do word-level diff
                    const wd = wordDiff(lines1[i], lines2[j]);
                    rows.push({ type: 'modified', left: wd.left, right: wd.right });
                    added += wd.added;
                    removed += wd.removed;
                    i++; j++;
                } else if (i < lines1.length) {
                    rows.push({ type: 'removed', left: escapeHtml(lines1[i]), right: '' });
                    removed++;
                    i++;
                } else if (j < lines2.length) {
                    rows.push({ type: 'added', left: '', right: escapeHtml(lines2[j]) });
                    added++;
                    j++;
                }
            }
            
            // Render as table rows — each diff pair is a single <tr> so heights always match
            const tbody = document.getElementById('diffBody');
            let html = '';
            for (const row of rows) {
                let rowClass = '';
                if (row.type === 'unchanged') rowClass = 'unchanged';
                else if (row.type === 'removed') rowClass = 'removed-row';
                else if (row.type === 'added') rowClass = 'added-row';
                else if (row.type === 'modified') rowClass = 'modified-row';
                
                html += `<tr class="${rowClass}">`;
                html += `<td class="left-cell">${row.left || '&nbsp;'}</td>`;
                html += `<td class="right-cell">${row.right || '&nbsp;'}</td>`;
                html += `</tr>`;
            }
            
            tbody.innerHTML = html || '<tr><td colspan="2" style="text-align:center;color:#888;padding:20px;">(no differences)</td></tr>';
            
            document.getElementById('stats').innerHTML = 
                `<span class="remove-count">−${removed} removed</span>` +
                `<span class="add-count">+${added} added</span>`;
        }
        
        function wordDiff(line1, line2) {
            const words1 = line1.split(/(\s+)/);
            const words2 = line2.split(/(\s+)/);
            const lcs = longestCommonSubsequence(words1, words2);
            
            let left = '', right = '';
            let i = 0, j = 0, k = 0;
            let added = 0, removed = 0;
            
            while (i < words1.length || j < words2.length) {
                if (k < lcs.length && i < words1.length && words1[i] === lcs[k]) {
                    if (j < words2.length && words2[j] === lcs[k]) {
                        left += escapeHtml(words1[i]);
                        right += escapeHtml(words2[j]);
                        i++; j++; k++;
                    } else {
                        right += `<span class="added">${escapeHtml(words2[j])}</span>`;
                        if (words2[j].trim()) added++;
                        j++;
                    }
                } else if (i < words1.length && !(k < lcs.length && j < words2.length && words2[j] === lcs[k])) {
                    left += `<span class="removed">${escapeHtml(words1[i])}</span>`;
                    if (words1[i].trim()) removed++;
                    i++;
                } else if (i < words1.length) {
                    left += `<span class="removed">${escapeHtml(words1[i])}</span>`;
                    if (words1[i].trim()) removed++;
                    i++;
                } else {
                    right += `<span class="added">${escapeHtml(words2[j])}</span>`;
                    if (words2[j].trim()) added++;
                    j++;
                }
            }
            return { left, right, added, removed };
        }
        
        function longestCommonSubsequence(arr1, arr2) {
            const m = arr1.length, n = arr2.length;
            const dp = Array(m + 1).fill(null).map(() => Array(n + 1).fill(0));
            
            for (let i = 1; i <= m; i++) {
                for (let j = 1; j <= n; j++) {
                    if (arr1[i-1] === arr2[j-1]) {
                        dp[i][j] = dp[i-1][j-1] + 1;
                    } else {
                        dp[i][j] = Math.max(dp[i-1][j], dp[i][j-1]);
                    }
                }
            }
            
            const lcs = [];
            let i = m, j = n;
            while (i > 0 && j > 0) {
                if (arr1[i-1] === arr2[j-1]) {
                    lcs.unshift(arr1[i-1]);
                    i--; j--;
                } else if (dp[i-1][j] > dp[i][j-1]) {
                    i--;
                } else {
                    j--;
                }
            }
            return lcs;
        }
        
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
        
        function swap() {
            const t1 = document.getElementById('text1');
            const t2 = document.getElementById('text2');
            [t1.value, t2.value] = [t2.value, t1.value];
        }
        
        function clearAll() {
            document.getElementById('text1').value = '';
            document.getElementById('text2').value = '';
            document.getElementById('diffBody').innerHTML = '';
            document.getElementById('stats').innerHTML = '';
        }
    </script>
</body>
</html>
